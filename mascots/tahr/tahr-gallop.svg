<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 186 146" class="mascot-svg" role="img" aria-label="Running Nilgiri tahr">
<style>
.g-a{animation:g-a .34s steps(1) infinite}.g-b{animation:g-b .34s steps(1) infinite}
.g-bob{animation:g-bob .34s ease-in-out infinite}
.g-dust{animation:g-dust .68s ease-out infinite}
.g-tail{transform-origin:50px 72px;animation:g-tail .34s ease-in-out infinite}
@keyframes g-a{0%{opacity:1}50%{opacity:0}}@keyframes g-b{0%{opacity:0}50%{opacity:1}}
@keyframes g-bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes g-dust{0%{opacity:.9;transform:translateX(0) scale(.6)}100%{opacity:0;transform:translateX(-18px) scale(1.2)}}
@keyframes g-tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-25deg)}}
@media (prefers-reduced-motion:reduce){.g-a,.g-b,.g-bob,.g-dust,.g-tail{animation:none}.g-b{opacity:0}}
