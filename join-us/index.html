<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Join Us</h1>
        <p>Fill in your details and choose the activities you are interested in.</p>

    <form>

    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" name="fullname">

    <label for="email">Email</label>
    <input type="email" id="email" name="email">

    <label for="activities">Select Activities</label>
    <select id="activities" name="activities" multiple>

        <option value="sports">Sports</option>
        <option value="music">Culture</option>
        <option value="volunteering">Family</option>
        <option value="workshops">Youth</option>
        <option value="events">Community</option>
        <option value="other">Volunteering</option>
    
    </select>


    <button type="submit">Join Us</button>


    </form>
</body>

</html>
